name: Auto-tag
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: auto-tag
  cancel-in-progress: false
jobs:
  auto-tag:
    # Tag VERSION when a push to main bumps it and its CHANGELOG section
    # exists. The tag push starts the Release workflow. Pushing the tag by
    # hand alongside the commit is fine: an existing tag (local or remote)
    # is a no-op, not a failure.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag VERSION when untagged
        run: |
          VER="$(tr -d '[:space:]' < VERSION)"
          TAG="v$VER"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already on origin — nothing to do"
            exit 0
          fi
          if ! grep -q "^## $VER" CHANGELOG.md; then
            echo "no CHANGELOG section for $VER — not tagging"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          if ! git push origin "$TAG"; then
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
              echo "$TAG was pushed concurrently — nothing to do"
              exit 0
            fi
            exit 1
          fi
          echo "tagged $TAG — Release workflow will pick it up"
