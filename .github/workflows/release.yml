name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract changelog for this release
        run: |
          TAG="## ${GITHUB_REF#refs/tags/}"
          python3 -c "
          import pathlib
          text = pathlib.Path('CHANGELOG.md').read_text()
          idx = text.find('''$TAG''')
          if idx == -1:
              body = 'No changelog entry found.'
          else:
              next_idx = text.find('## ', idx + len('''$TAG'''))
              if next_idx == -1:
                  body = text[idx:].strip()
              else:
                  body = text[idx:next_idx].strip()
          pathlib.Path('RELEASE_BODY.md').write_text(body)
          print(body)
          "
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          body_path: RELEASE_BODY.md
          files: |
            custom_components/foxair/manifest.json
            README.md
