name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract changelog for this release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 -c "
          import pathlib, os
          text = pathlib.Path('CHANGELOG.md').read_text()
          header = '## ' + os.environ['TAG'].lstrip('v')
          idx = text.find(header)
          if idx == -1:
              body = 'No changelog entry found for this tag.'
          else:
              next_idx = text.find('## ', idx + len(header))
              if next_idx == -1:
                  body = text[idx:].strip()
              else:
                  body = text[idx:next_idx].strip()
          pathlib.Path('RELEASE_BODY.md').write_text(body)
          print('=== RELEASE_BODY.md ===')
          print(body)
          print('=== END ===')
          "
      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          files: |
            custom_components/foxair/manifest.json
            README.md
      - name: Set release body from CHANGELOG
        uses: actions/github-script@v9
        env:
          TAG: ${{ github.ref_name }}
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('RELEASE_BODY.md', 'utf8');
            const tag = process.env.TAG;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            console.log('Tag:', tag);
            const getResp = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            const releaseId = getResp.data.id;
            const updateResp = await github.rest.repos.updateRelease({
              owner, repo, release_id: releaseId, body
            });
            console.log('Release body updated, length:', body.length);
            console.log('Release URL:', updateResp.data.html_url);
