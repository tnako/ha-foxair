name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract changelog for this release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 -c "
          import pathlib, os
          text = pathlib.Path('CHANGELOG.md').read_text()
          header = '## ' + os.environ['TAG']
          idx = text.find(header)
          if idx == -1:
              body = 'No changelog entry found for this tag.'
          else:
              next_idx = text.find('## ', idx + len(header))
              if next_idx == -1:
                  body = text[idx:].strip()
              else:
                  body = text[idx:next_idx].strip()
          pathlib.Path('RELEASE_BODY.md').write_text(body)
          print('=== RELEASE_BODY.md ===')
          print(body)
          print('=== END ===')
          "
      - name: Update release body from CHANGELOG
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('RELEASE_BODY.md', 'utf8');
            const response = await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: context.refName,
              body: body,
            });
            console.log('Release body updated, length:', body.length);
            console.log('Release URL:', response.data.html_url);
