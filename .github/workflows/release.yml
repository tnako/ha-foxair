name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract changelog for this release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 << 'PYEOF'
          import pathlib, os
          text = pathlib.Path('CHANGELOG.md').read_text()
          tag = '## ' + os.environ['TAG']
          idx = text.find(tag)
          if idx == -1:
              body = 'No changelog entry found for this tag.'
          else:
              next_idx = text.find('## ', idx + len(tag))
              if next_idx == -1:
                  body = text[idx:].strip()
              else:
                  body = text[idx:next_idx].strip()
          pathlib.Path('RELEASE_BODY.md').write_text(body)
          print('=== RELEASE_BODY.md START ===')
          print(body)
          print('=== RELEASE_BODY.md END ===')
          PYEOF
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          body_path: RELEASE_BODY.md
          files: |
            custom_components/foxair/manifest.json
            README.md
