version: '3'

vars:
  PY: '{{.PY | default (env "FOXAIR_PY") | default "python3"}}'

tasks:
  validate:
    desc: Run validation checks (VERSION==manifest, i18n prefixes, syntax)
    cmds:
      - '{{.PY}} tools/validate.py'

  build:
    desc: Regenerate metadata and vendor package
    cmds:
      - '{{.PY}} tools/build_metadata.py'
      - '{{.PY}} tools/fix_translations.py'
      - '{{.PY}} tools/gen_foxair_modbus.py'
      - '{{.PY}} tools/validate.py'

  test:
    desc: Run full pytest suite (signatures, firmware gates, curve math, SVG render, validate)
    cmds:
      - '{{.PY}} -m pytest tests/ -v'

  pre_release:
    desc: Pre-release gate - validate + metadata regen + pytest + check_regs
    cmds:
      - task: validate
      - '{{.PY}} tools/build_metadata.py'
      - task: validate
      - task: test
      - '{{.PY}} tools/check_regs.py'

  check_regs:
    desc: Check every register - HA state vs device
    cmds:
      - '{{.PY}} tools/check_regs.py'

  deploy:
    desc: Deploy to HA host and verify health
    cmds:
      - tools/deploy.sh  # reads HA_HOST from .env

  # sync_fc removed — sibling repo is private (copy manually if needed)

  bump:
    desc: "Bump VERSION and manifest (usage: task bump version=X.Y.Z; CHANGELOG entry must exist first)"
    cmds:
      - '{{.PY}} tools/bump_version.py ''{{.version}}'''

  hooks:
    desc: Enable repo git hooks (pre-commit validate, pre-push validate+pytest)
    cmds:
      - git config core.hooksPath .githooks

default:
  cmd: task --list
