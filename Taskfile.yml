version: '3'

tasks:
  validate:
    desc: Run validation checks (VERSION==manifest, i18n prefixes, syntax)
    cmds:
      - python3 tools/validate.py

  build:
    desc: Regenerate metadata and vendor package
    cmds:
      - python3 tools/build_metadata.py
      - python3 tools/fix_translations.py
      - python3 tools/gen_foxair_modbus.py
      - python3 tools/validate.py

  test:
    desc: Run full pytest suite (signatures, firmware gates, curve math, SVG render, validate)
    cmds:
      - python3 -m pytest tests/ -v

  pre_release:
    desc: Pre-release gate - validate + metadata regen + pytest + check_regs
    cmds:
      - task: validate
      - python3 tools/build_metadata.py
      - task: validate
      - task: test
      - python3 tools/check_regs.py

  check_regs:
    desc: Check every register - HA state vs device
    cmds:
      - python3 tools/check_regs.py

  deploy:
    desc: Deploy to HA host and verify health
    cmds:
      - tools/deploy.sh  # reads HA_HOST from .env

  sync_fc:
    desc: Sync register data to FoxAir_Control repo
    cmds:
      - cp custom_components/foxair/data/foxair_phnix_registers.json ../FoxAir_Control/data/
      - cp custom_components/foxair/data/foxair_phnix_knowledge.json ../FoxAir_Control/data/

  bump:
    desc: Bump VERSION and manifest, then tag and push
    vars:
      version:
        sh: "echo ''"
    cmds:
      - python3 tools/bump_version.py '{{.version}}'

default:
  cmd: task --list
